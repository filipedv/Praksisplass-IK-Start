# CI — runs our checks on every pull request (and on pushes to main), so a
# broken build or a failing database test shows up as a red ✗ on the PR
# before anyone merges it.
#
# It only CHECKS code. It never touches the real Supabase project, needs no
# secrets, and deploys nothing. The database tests run against PGlite
# (Postgres compiled to WebAssembly) inside the job.
#
# Each part of App/ is its own job, so they run in parallel and the PR shows
# exactly which part failed.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database-tests:
    name: Database (RLS + SQL functions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App/supabase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: App/supabase/tests/package-lock.json
      - run: npm ci
      - run: npm test

  admin-panel:
    name: Admin panel (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App/admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: App/admin-panel/package-lock.json
      - run: npm ci
      - run: npm run build # includes tsc
      - run: npm run lint

  player-app:
    name: Player app (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App/player-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: App/player-app/package-lock.json
      - run: npm ci
      # Typed routes (.expo/types) are git-ignored and only generated by
      # `expo start`; without them route names are typed as plain strings,
      # so this still catches every other type error.
      - run: npx tsc --noEmit
      - run: npx expo lint

  node-tools:
    name: Recognition proxy + seed script (typecheck)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [App/recognition-proxy, App/scripts/seed-foods]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  edge-function:
    name: Edge Function admin-users (deno check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App/supabase/functions/admin-users
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config deno.json index.ts
